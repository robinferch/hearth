name: Hearth
options:
  bundleIdPrefix: dev.hearth
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: false
  groupSortPosition: top
  xcodeVersion: "27.0"

configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic

packages:
  HearthKit:
    path: Packages/HearthKit

targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
        type: syncedFolder
      - path: App/Resources/iOS
        buildPhase: resources
        optional: true
      - path: Hearth.icon
        buildPhase: resources
    dependencies:
      - package: HearthKit
        product: HearthModel
      - package: HearthKit
        product: HearthAPI
      - package: HearthKit
        product: HearthData
      - package: HearthKit
        product: HearthPlayback
      - package: HearthKit
        product: HearthUI
      - package: HearthKit
        product: HearthIntents
      - target: HearthWidgets
      - target: HearthWatch
    settings:
      base:
        PRODUCT_NAME: Hearth
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).hearth
        CODE_SIGN_ENTITLEMENTS: App/Support/iOS/Hearth-$(HEARTH_ENTITLEMENTS).entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Hearth
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Hearth
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Support/iOS/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HearthAppGroup: $(HEARTH_APP_GROUP)
        HearthKeychainGroup: $(HEARTH_KEYCHAIN_GROUP)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.books
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).autodownload
          - $(PRODUCT_BUNDLE_IDENTIFIER).sync
          - $(PRODUCT_BUNDLE_IDENTIFIER).spotlight
        NSSupportsLiveActivities: true
        CoreSpotlightContinuation: true
        NSUserActivityTypes:
          - $(PRODUCT_BUNDLE_IDENTIFIER).item
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [hearth]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Hearth connects to audiobookshelf servers on your local network.
        NSSiriUsageDescription: Play and control audiobooks and podcasts from your library with Siri.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: search
            UIApplicationShortcutItemTitle: Search
            UIApplicationShortcutItemIconSymbolName: magnifyingglass
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate

  HearthWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
        type: syncedFolder
      - path: App/Resources/Widgets
        buildPhase: resources
        optional: true
      # App Intents strings (HearthIntents) are resolved in the host bundle's `System` table.
      - path: App/Resources/iOS/System.xcstrings
        buildPhase: resources
    dependencies:
      - package: HearthKit
        product: HearthModel
      - package: HearthKit
        product: HearthData
      - package: HearthKit
        product: HearthUI
      - package: HearthKit
        product: HearthIntents
      - package: HearthKit
        product: HearthPlayback
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).hearth.widgets
        CODE_SIGN_ENTITLEMENTS: App/Support/Widgets/HearthWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: App/Support/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HearthAppGroup: $(HEARTH_APP_GROUP)
        HearthKeychainGroup: $(HEARTH_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  HearthWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/Watch
        type: syncedFolder
      - path: App/Resources/Watch
        buildPhase: resources
        optional: true
      - path: Hearth.icon
        buildPhase: resources
    dependencies:
      - package: HearthKit
        product: HearthModel
      - package: HearthKit
        product: HearthAPI
      - package: HearthKit
        product: HearthData
      - package: HearthKit
        product: HearthPlayback
      - package: HearthKit
        product: HearthUI
      - target: HearthWatchWidgets
    settings:
      base:
        PRODUCT_NAME: Hearth
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).hearth.watchkitapp
        CODE_SIGN_ENTITLEMENTS: App/Support/Watch/HearthWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: Hearth
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: App/Support/Watch/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HearthAppGroup: $(HEARTH_APP_GROUP)
        HearthKeychainGroup: $(HEARTH_KEYCHAIN_GROUP)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).hearth
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [hearth]
        WKBackgroundModes: [audio]
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  HearthWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: App/WatchWidgets
        type: syncedFolder
      - path: App/Resources/WatchWidgets
        buildPhase: resources
        optional: true
    dependencies:
      - package: HearthKit
        product: HearthModel
      - package: HearthKit
        product: HearthData
      - package: HearthKit
        product: HearthUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).hearth.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: App/Support/WatchWidgets/HearthWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: App/Support/WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HearthAppGroup: $(HEARTH_APP_GROUP)
        HearthKeychainGroup: $(HEARTH_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  HearthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
        type: syncedFolder
    dependencies:
      - target: Hearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).hearth.uitests
        TEST_TARGET_NAME: Hearth
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Hearth:
    build:
      targets:
        Hearth: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HearthUITests
    archive:
      config: Release
  HearthWatch:
    build:
      targets:
        HearthWatch: all
    run:
      config: Debug

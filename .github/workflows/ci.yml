name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package tests & build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION || 'latest-stable' }}

      - name: Install tools
        run: |
          brew install xcodegen
          ls -d /Applications/Xcode*.app
          xcodebuild -version

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/HearthKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/HearthKit/Package.swift', 'Packages/HearthKit/Package.resolved') }}

      - name: HearthKit tests
        run: bundle exec fastlane test

      - name: Build iOS and watchOS
        run: bundle exec fastlane build
